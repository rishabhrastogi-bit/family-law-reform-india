# Check Delhi District Courts' VC-links PDFs for updates
#
# REMOVABLE BY DESIGN — this workflow only ever opens a PR with the refreshed
# data/delhi-court-vc-links.csv (for districts whose official PDF changed)
# plus data/vc-links-manifest.json and vc-links-update-report.md. It never
# touches index.html directly. To stop using it:
#   - Pause without deleting anything: Actions tab -> this workflow ->
#     "..." -> Disable workflow. Re-enable any time.
#   - Remove permanently: delete this file, scripts/fetch_vc_links.py, and
#     data/vc-links-manifest.json. data/delhi-court-vc-links.csv stays
#     usable as a plain data file either way.
#
# No public trigger by design: this only runs on a schedule, not from a
# button on the live site — a static site can't safely hold the credentials
# to trigger this, and a public trigger would let any visitor repeatedly
# hit 12 government court sites.
#
# Scheduled runs only make a commit-worthy diff when a district's PDF
# actually changed; unchanged districts are left untouched every time.

name: Check Delhi Court VC Links for Updates

on:
  schedule:
    - cron: '0 6 * * 1'   # 06:00 UTC every Monday

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet certifi pdfplumber

      - name: Check for VC link updates
        run: python3 scripts/fetch_vc_links.py
        continue-on-error: true   # a fetch error on one district shouldn't block a PR for the rest

      - name: Open PR with any refreshed district data
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Delhi court VC links: refresh changed districts"
          branch: vc-links-update/${{ github.run_number }}
          title: "Delhi court VC links: refresh for changed districts"
          body: |
            Automated check of all 12 Delhi District Court complexes' official
            "VC Links" pages — **no changes to index.html**.

            See `vc-links-update-report.md` for what changed, what needs manual
            attention, and any fetch errors. For any updated district, spot-check
            a few rows in `data/delhi-court-vc-links.csv` against the source PDF
            linked in that district's rows before merging — PDF table extraction
            can occasionally misalign a cell. Delete this branch/PR once reviewed
            (or if nothing changed and there's no diff to review).
          add-paths: |
            data/delhi-court-vc-links.csv
            data/vc-links-manifest.json
            vc-links-update-report.md
          delete-branch: true
